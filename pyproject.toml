[project]
name = "notificaciones"
version = "0.1.0"
description = "Microservicio de Notificaciones (Desarrollo II)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "aio-pika>=10.2.1",
    "alembic>=1.20.1",
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.16.1",
    "sqlalchemy>=2.1.6",
    "uvicorn>=0.54.0",
]

[tool.uv]
# Aplicación, no librería: uv instala solo las dependencias.
package = false

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.3",
    "testcontainers[postgres]>=4.15.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
files = ["app"]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
# Global >= 80 %. Domain + security al 100 %:
#   coverage report --include='app/domain/*,app/security/*' --fail-under=100
fail_under = 80
show_missing = true
