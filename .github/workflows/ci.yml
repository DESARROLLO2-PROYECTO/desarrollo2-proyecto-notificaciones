name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop]  # Sonar necesita una rama base analizada

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          version: "0.13.0"
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy app
      # unit + integración (testcontainers levanta postgres:16.15-alpine); aplica fail_under=80
      - run: uv run pytest --cov=app --cov-report=xml
      - run: uv run coverage report --include='app/domain/*,app/security/*' --fail-under=100
      - uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.xml

  docker:
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: docker build .

  sonar:
    needs: test
    # Se activa con la variable de repo SONAR_ENABLED=true (secrets no se pueden usar en if de job)
    if: ${{ vars.SONAR_ENABLED == 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          name: coverage
      - uses: SonarSource/sonarqube-scan-action@v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
